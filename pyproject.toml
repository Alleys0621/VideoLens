[project]
name = "videolens"
version = "0.1.0"
description = "影视视频内容分析与检索系统 - 基于多模态 AI 的长视频场景分割、内容理解与语义检索平台"
requires-python = ">=3.12.10,<3.13"

[dependency-groups]
dev = [
    "poethepoet>=0.34",
    "pytest>=8.3.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.poe.tasks]
sync = { cmd = "uv pip install -r requirements.txt", help = "安装依赖" }
run = { cmd = "uv run python -m src.app.main run", help = "运行视频流水线" }
test = { cmd = "uv run python -m src.app.main test", help = "测试单个 Stage" }

[tool.poe.executor]
type = "uv"
