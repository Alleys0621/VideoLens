# VideoLens Prompt 模板

# ============================================================
# Stage 3: 视觉语义理解 - 结构化场景描述 (VLM)
# ============================================================
scene_caption:
  system: "你是一名视频分析师，擅长对各种视频片段进行理解。"
  user: |
    你正在分析视频「{video_title}」，这是一个{genre}类视频，主要角色包括：{rolesText}

    【任务目标】
    基于关键帧图像序列 + 对应台词 + 已有剧情总结 + 上一帧结构化摘要，生成聚合后的轻量结构化摘要（JSON 格式），用于后续剧情知识库的自动更新。

    【输出格式要求】
    1. JSON 中必须首先体现场景分层信息，字段为 time_of_day / subspace / space / scene。
       - time_of_day：从视觉线索判断"白天"或"晚上"。
       - subspace：更细的子区域，如"沙发上"、"树下"。
       - space：具体环境名称，如"实验室"、"草地"、"舞台"等。
       - scene：从视觉线索判断"室内"或"室外"。
    2. JSON 中必须包含以下字段信息：

    ```json
    {{
      "time_of_day": "白天",
      "subspace": "沙发上",
      "space": "实验室外",
      "scene": "室内",
      "characters": ["角色A", "角色B"],
      "main_actions": "主要动作描述",
      "interactions": "角色间互动描述",
      "emotion": "情感基调",
      "plot_state": "剧情推进状态"
    }}
    ```

    【Scene 识别强化指令】
    - 若画面出现天空、树木、草地、阳光等元素 → scene=室外
    - 若出现墙壁、家具、灯光、实验设备等 → scene=室内
    - 绝不可默认室内，需优先搜索画面中的自然环境线索
    - 若 scene 与 space/subspace 语义冲突，以 space/subspace 为准修正 scene

    【限制】
    - 分析范围严格限定于提供的视频子片段，不涉及视频之外的推测
    - 保持对所有视频元素的高保真还原

    【输入信息】
    - 已有剧情总结：{summary}
    - 当前帧图像序列台词：{audiotext}
    - 上一帧图片描述结构化摘要：{caption}

# ============================================================
# Stage 5: 结构化知识库生成 (增量更新)
# ============================================================
knowledge_summary:
  system: "你是一个视频内容分析师，擅长梳理剧情结构并构建知识库。"
  user: |
    你正在分析视频「{video_title}」，这是一个{genre}类视频。

    【任务目标】
    基于【已有剧情知识库】、【caption 模块输出的 JSON】（当前帧图像描述）和【音频识别结果】，对剧情知识库进行【增量更新】，维持严格的三层结构化格式。

    【剧情知识库结构】
    - 第一层（视频层）：固定为视频名称。
    - 第二层（大事件层）：当 scene 字段出现变化（例如室内→室外，或室外→室内）时，才创建新大事件。
    - 第三层（小事件层）：描述该大事件内的具体人物相关的事件。

    【大事件命名规则】
    1. 按"幕次 + 白天/晚上 + 室内/室外"命名，如"第一幕：白天室内"
    2. 如果视频内容不具备明确时间，可简化为"第一幕：室内/室外"
    3. 仅当时间(白天↔晚上)或场景(室内↔室外)发生变化时才创建新幕

    【更新规则】
    1. 增量更新原则 — 新信息仅追加或合并，不覆盖历史
    2. 若 scene 为"无法判断"或"未知"，视为与上一帧相同，不触发新大事件
    3. 若相邻帧的 scene / space / characters 基本一致，视为同一小事件，不重复创建
    4. 小事件内容：一句话简要描述角色、动作、互动，20字以内

    【输出格式】
    输出严格的 JSON，仅包含结构化知识库：

    ```json
    {{
      "{video_title}": {{
        "大事件名称1": {{
          "小事件名称1": "一句简明说明",
          "小事件名称2": "一句简明说明"
        }},
        "大事件名称2": {{
          "小事件名称1": "一句简明说明"
        }}
      }}
    }}
    ```

    【输入信息】
    - 当前帧图像描述（caption 模块输出的 JSON）：{caption}
    - 当前帧音频识别结果：{audiotext}
    - 已有剧情知识库：{summary}

# ============================================================
# 检索: 查询扩展
# ============================================================
query_expand:
  system: "你是一个视频内容检索的查询优化器。"
  user: |
    将以下搜索查询扩展为多个相关搜索词，用于查找相关视频场景。
    查询：{query}
    请直接输出扩展后的搜索词，用空格分隔。

# ============================================================
# 检索: 重排
# ============================================================
rerank:
  system: "你是一个视频场景相关性评判专家。"
  user: |
    评估以下场景与查询的相关性，按 1-10 打分。
    查询：{query}
    场景描述：{scene_caption}
    台词：{transcript}
    只输出分数。

# ============================================================
# QA: 视频问答
# ============================================================
qa_answer:
  system: "你是一个视频内容分析助手，擅长根据场景信息回答用户关于视频内容的问题。"
  user: |
    基于以下检索到的视频场景信息，回答用户的问题。

    【用户问题】
    {question}

    【相关场景信息】
    {context}

    【要求】
    1. 基于场景信息回答，不要编造内容
    2. 如果信息不足以回答，请明确说明
    3. 用中文回答，简洁清晰
    4. 可以引用具体的时间点

# ============================================================
# Analyze: 视频内容摘要
# ============================================================
analyze_summary:
  system: "你是一个专业的视频内容分析师。"
  user: |
    对视频 {video_id} 进行内容摘要分析。共 {scene_count} 个场景。

    【场景信息】
    {context}

    请生成完整的内容摘要，包括：
    1. 视频主要内容
    2. 关键情节点
    3. 整体氛围和主题

# ============================================================
# Analyze: 角色分析
# ============================================================
analyze_characters:
  system: "你是一个专业的影视角色分析师。"
  user: |
    对视频 {video_id} 中的角色进行分析。共 {scene_count} 个场景。

    【场景信息】
    {context}

    请分析视频中出现的角色：
    1. 主要角色及其特征
    2. 角色间的关系
    3. 角色的情感变化

# ============================================================
# Analyze: 时间线梳理
# ============================================================
analyze_timeline:
  system: "你是一个专业的视频时间线分析师。"
  user: |
    对视频 {video_id} 进行时间线梳理。共 {scene_count} 个场景。

    【场景信息】
    {context}

    请梳理视频的时间线：
    1. 按时间顺序列出关键事件
    2. 标注重要的场景转换
    3. 总结叙事结构
