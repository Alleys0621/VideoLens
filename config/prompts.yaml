# VideoLens Prompt 模板

# ============================================================
# Stage 2: 全模态视频理解 (Qwen-Omni)
# ============================================================
stage2_omni:

  system: "你是一个音频理解模块，专注于语音识别、说话人分离和情感标注，不进行视觉理解和剧情分析。"

  user: |
    请分析该视频片段中的音频内容。

    ----------------------
    【任务目标】

    1. 识别所有语音内容（ASR）
    2. 区分不同说话人（speaker diarization）
    3. 标注每句台词的情绪（emotion）

    ----------------------
    【严格限制（必须遵守）】

    - ❌ 不分析剧情
    - ❌ 不推测角色意图
    - ❌ 不总结内容
    - ❌ 不输出视觉动作（如“追逐”“打斗”）
    - ❌ 不描述画面内容

    ----------------------
    【说话人规则】

    - 使用：说话人A / 说话人B / 说话人C
    - 根据音色区分
    - 不确定身份时：possible_identity = "未知"
    - 若画面明显可识别角色（如灰太狼），可标注

    ----------------------
    【情绪标签（必须从以下选择）】

    平静、愉快、悲伤、愤怒、惊讶、恐惧、厌恶

    ----------------------
    【输出格式（严格 JSON）】

    ```json
    {{
      "content_type": "main",
      "speakers": [
        {{
          "id": "说话人A",
          "description": "低沉男声",
          "possible_identity": "灰太狼或未知"
        }}
      ],
      "transcript": [
        {{
          "start": 0.0,
          "end": 2.5,
          "speaker": "说话人A",
          "emotion": "愤怒",
          "text": "台词内容"
        }}
      ]
    }}
    ```

    ----------------------
    【补充规则】

    1. start/end 为相对时间（秒），保留1位小数
    2. 如果无语音：
       ```json
       "transcript": []
       ```
    3. 只输出 JSON，不要输出任何解释
    4. 忽略时长不足 1 秒的短促语气词（如"啊""嗯""哦"等），不纳入 transcript
    5. 每条台词时长应 ≥ 1 秒，低于此阈值的片段不要输出
# ============================================================
# Stage 2: 从台词中提取角色名
# ============================================================
stage2_character_extract:
  user: |
    以下是一部视频的台词片段：
    {transcript_summary}

    已识别的角色：{existing_names}

    请列出台词中出现的所有角色名，每行一个，只输出名字。

# ============================================================
# Stage 3: 视觉语义理解 - 结构化场景描述 (VLM)
# ============================================================
scene_caption:

  system: "你是逐帧视频分析器，只输出原子级动作标签。"

  user: |
    【任务】
    基于当前帧，提取结构化动作。

    ----------------------

    【Action必须从以下列表选择】
    move, approach, leave, chase, escape,
    attack, defend, threaten,
    talk, argue, command,
    observe, search, discover,
    deceive, trick, hide, steal, exchange,
    idle, react

    ----------------------

    【规则（必须遵守）】

    1. 每个角色最多一个 action
    2. action 必须来自列表（禁止自由生成）
    3. 不允许使用句子描述动作
    4. 不允许出现“然后 / 并 / 接着”
    5. 不允许描述动机（如“试图”）

    ----------------------

    【输出格式】

    ```json
    {{
      "time_of_day": "白天/晚上",
      "scene": "室内/室外",
      "space": "地点",
      "characters": ["角色A"],
      "actions": [
        {{
          "character": "角色A", "action": "chase", "target": "角色B"}}
      ],
      "interaction": "无/对话/冲突",
      "temporal_relation": "延续/变化"
    }}
    ```

    【动作定义规则】
    - 每个 action 必须是“单一动作”（不要复合句）
    - 不包含因果，不包含总结

    【输入】
    - 当前台词：{audiotext}
    - 上一帧摘要：{caption}

# ============================================================
# Stage 4: Event Builder - 从连续帧描述中提取事件
# ============================================================
event_builder:

  system: "你是事件构建器，只能构建最小粒度事件。"

  user: |
    输入为连续帧的 actions。

    ----------------------

    【事件定义（严格）】

    一个事件必须：
    - 单一 action
    - 单一目标
    - 连续发生

    ----------------------

    【新事件触发条件】

    - action 改变
    - target 改变
    - 角色组合改变

    ----------------------

    【Goal规则】

    - ≤10字
    - 不包含“并 / 然后”
    - 表示意图（不是行为）

    ----------------------

    【禁止】

    - ❌ 不允许 action 使用“/”
    - ❌ 不允许多个 action
    - ❌ 不允许写总结句

    ----------------------

    【输出格式】

    ```json
    [
      {{
        "event_id": "E1",
        "characters": ["角色A"],
        "action": "chase",
        "target": "角色B",
        "goal": "抓住目标",
        "start_scene": 12,
        "end_scene": 18
      }}
    ]
    ```

    【输入】
    以下为连续帧描述：
    {frame_descriptions}

# ============================================================
# Stage 5: 结构化知识库生成 (增量更新)
# ============================================================
knowledge_summary:

  system: "你是一个结构化事件管理器，负责维护视频剧情知识库。你不会编造剧情，只基于输入做增量整理。"

  user: |
    你正在分析视频{video_title}。

    【你的职责（非常重要）】
    你不是在“写剧情总结”，而是在执行：
    1. 判断当前是否产生“新事件”
    2. 或将当前内容合并进已有事件
    3. 维护结构化知识库

    ------------------------
    【事件定义（核心规则）】
    一个“事件”必须满足：
    - 有明确参与角色（characters）
    - 有明确动作（actions）
    - 有一个局部目标或意图（goal）

    ------------------------
    【新事件触发条件（满足任一）】
    - 角色目标发生变化（例如：抓羊 → 偷蛋）
    - 动作类型发生变化（追逐 → 对话 → 攻击）
    - 关键互动发生（威胁 / 欺骗 / 交换）
    - 场景变化 + 行为变化同时发生（仅scene变化不算）

    ------------------------
    【事件合并条件】
    如果当前内容：
    - 与上一事件角色一致
    - 动作类型一致（如持续追逐）
    - 目标未改变

    👉 则合并为同一事件（不要新增）

    ------------------------
    【大事件（阶段）划分规则】
    - 一组“强相关事件”构成一个阶段
    - 阶段由“目标或冲突”定义，而不是 scene
    - 示例：
      - 阶段1：灰太狼试图抓羊
      - 阶段2：灰太狼转而偷蛋
      - 阶段3：小羊反制计划

    ------------------------
    【输出结构（重要变化）】

    ```json
    {{
      "{video_title}": {{
        "阶段1: 阶段名称": {{
          "E1": {{
            "characters": [],
            "action": "",
            "goal": "",
            "summary": ""
          }},
          "E2": {{}}
        }},
        "阶段2: 阶段名称": {{}}
      }}
    }}
    ```

    ------------------------
    【字段说明】

    - characters：角色列表
    - action：标准化动作（如“追逐 / 对话 / 威胁 / 逃跑 / 欺骗”）
    - goal：该事件的目标（非常关键）
    - summary：一句自然语言描述（≤20字）

    ------------------------
    【严格限制】

    - ❌ 不允许改写已有事件
    - ❌ 不允许删除历史事件
    - ❌ 不允许总结整段剧情
    - ❌ 不允许生成未出现的信息

    ------------------------
    【去重规则（关键）】

    如果当前信息可以归入已有事件：
    👉 必须复用该事件（不要创建新ID）

    ------------------------
    【输入信息】

    - 当前帧 caption（结构化）：{caption}
    - 当前音频：{audiotext}
    - 已有知识库：{summary}

    ------------------------
    【你的输出】

    输出完整更新后的 JSON（不是增量片段）
# ============================================================
# 检索: 查询扩展
# ============================================================
query_expand:
  system: "你是一个视频内容检索的查询优化器。"
  user: |
    将以下搜索查询扩展为多个相关搜索词，用于查找相关视频场景。
    查询：{query}
    请直接输出扩展后的搜索词，用空格分隔。

# ============================================================
# 检索: 重排
# ============================================================
rerank:
  system: "你是一个视频场景相关性评判专家。"
  user: |
    评估以下场景与查询的相关性，按 1-10 打分。
    查询：{query}
    场景描述：{scene_caption}
    台词：{transcript}
    只输出分数。

# ============================================================
# QA: 视频问答
# ============================================================
qa_answer:
  system: "你是一个视频内容分析助手，擅长根据场景信息回答用户关于视频内容的问题。"
  user: |
    基于以下检索到的视频场景信息，回答用户的问题。

    【用户问题】
    {question}

    【相关场景信息】
    {context}

    【要求】
    1. 基于场景信息回答，不要编造内容
    2. 如果信息不足以回答，请明确说明
    3. 用中文回答，简洁清晰
    4. 可以引用具体的时间点

# ============================================================
# QA: 基于结构化知识库问答
# ============================================================
kb_qa:
  system: "你是视频内容分析助手，基于结构化知识库回答问题。"
  user: |
    基于以下视频结构化知识库，回答用户问题。

    【视频标题】
    {video_title}

    【知识库】
    {knowledge_base}

    【用户问题】
    {question}

    【任务要求】
    请先判断问题类型，再按对应规则回答：

    【问题类型】
    1. 事实类问题（如：谁/什么/哪里/是否发生）
    2. 推理/总结类问题（如：为什么/如何/主题/意义/结果/如果…会怎样）

    【回答规则】

    —— 如果是【事实类问题】：
    - 只能基于知识库中的明确事实回答
    - 不得补充、推测或扩展
    - 若知识库未提供，直接回答“知识库未提供相关信息”

    —— 如果是【推理/总结类问题】：
    - 基于知识库中的事实进行合理推理或总结
    - 可以使用常识进行辅助推断，但不得编造新事件
    - 给出简洁结论，不需要展开推理过程

    【通用要求】
    - 优先给出结论，不要逐阶段罗列
    - 不要输出分析过程或分类判断过程
    - 控制在1-3句话，简洁清晰
    - 用中文回答