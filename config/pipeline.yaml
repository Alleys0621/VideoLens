# VideoLens 流水线配置

models:
  omni_plus: "qwen3.5-omni-plus"       # 片头/片尾曲检测
  omni_flash: "qwen3.5-omni-flash"     # ASR + 情感 + 时间戳
  vlm: "qwen-vl-max"                   # 视觉描述 (Caption)
  ocr: "qwen3-vl-plus"                 # 字幕 OCR (输入便宜, 多帧采样友好)
  text: "qwen3.7-plus"                 # 文本生成 (Stage 3 P1/P2)

# 声纹库配置: 每个影视作品有独立的讯飞声纹组和角色映射
# key = 视频子目录名 (data/videos/ 下的文件夹名)
voiceprint_groups:
  喜羊羊与灰太狼:
    group_id: "xiyangyang"
    name_mapping:
      xiyangyang: "喜羊羊"
      huitailang: "灰太狼"
      hongtailang: "红太狼"
      meiyangyang: "美羊羊"
      lanyangyang: "懒羊羊"
      feiyangyang: "沸羊羊"
      manyangyang: "慢羊羊"
  家有儿女:
    group_id: "hwk"
    name_mapping:
      liuxing: "刘星"
      xiaxue: "夏雪"
      xiayu: "夏雨"
      xiadonghai: "夏东海"
      liumei: "刘梅"
  西游记:
    group_id: "xiyouji"
    name_mapping:
      sunwukong: "孙悟空"
      zhubajie: "猪八戒"
      tangseng: "唐僧"
      shaseng: "沙僧"

stage2:
  min_scene_len: 1.0                   # 最短场景时长 (秒)
  samples_per_scene: 8                 # 每个场景提取的关键帧数 (回退路径)
  transnet_threshold: 0.5              # TransNetV2 边界阈值 (回退路径)
  transnet_model_path: "models/transnetv2.onnx"

paths:
  data_root: "data"
  output_root: "data/output"

# 模型定价 (CNY / 百万 tokens, 中国内地)
# 来源: https://help.aliyun.com/zh/model-studio/model-pricing
# 字段含义:
#   text_input   纯文本输入
#   audio_input  音频输入 (omni 系列按输入模态分档)
#   image_input  图片/视频输入
#   text_output  文本输出 (本流水线所有调用均为文本输出)
pricing:
  qwen3.5-omni-plus:
    text_input: 7.0
    audio_input: 53.0
    image_input: 40.0
    text_output: 213.0
  qwen3.5-omni-flash:
    text_input: 2.2
    audio_input: 18.0
    image_input: 13.3
    text_output: 72.0
  qwen-vl-max:
    text_input: 3.0
    image_input: 3.0
    text_output: 9.0
  qwen3-vl-plus:
    text_input: 1.4
    image_input: 1.4
    text_output: 11.2
  qwen3.7-plus:
    text_input: 1
    text_output: 4
