# VideoLens 流水线配置

models:
  vlm: "qwen-vl-max"
  text: "qwen-plus"
  omni: "qwen3.5-omni-plus"    # Qwen3.5-Omni 全模态模型
  whisper: "medium"
  clip: "sentence-transformers/clip-ViT-B-32"

scene_detection:
  backend: "pyscenedetect"
  content_threshold: 27.0
  min_scene_len: 1.0   # 秒
  samples_per_scene: 8  # 每个场景提取的关键帧数
  vlm_window_size: 4    # VLM 滑动窗口大小
  vlm_stride: 2         # VLM 滑动窗口步长

asr:
  backend: "qwen-omni"       # "qwen-omni" (全模态) / "qwen" (ASR) / "whisper" (本地)
  language: "zh"
  beam_size: 5
  vad_filter: true
  chunk_duration: 120         # 全模态理解每块最大秒数 (推荐 ≤120s)
  silence_min_len: 500        # 静音检测最短时长 ms
  silence_thresh: -40          # 静音检测阈值 dBFS
  max_keyframes_per_chunk: 5  # 每块最多发送的关键帧数

clip:
  embedding_dim: 512
  batch_size: 32

retrieval:
  top_k: 10
  use_llm_rerank: true

paths:
  data_root: "data"
  output_root: "data/output"
