# VideoLens 流水线配置

models:
  vlm: "qwen-vl-max"
  text: "qwen-plus"
  omni: "qwen3.5-omni-plus"
  clip: "sentence-transformers/clip-ViT-B-32"

scene_detection:
  backend: "pyscenedetect"
  content_threshold: 27.0
  min_scene_len: 1.0   # 秒
  samples_per_scene: 8  # 每个场景提取的关键帧数
  vlm_window_size: 4    # VLM 滑动窗口大小
  vlm_stride: 2         # VLM 滑动窗口步长

asr:
  language: "zh"
  chunk_duration: 120
  max_keyframes_per_chunk: 5

# 声纹识别 (讯飞)
voiceprint:
  enabled: true
  group_id: "default_group"
  score_threshold: 0.3
  min_duration: 3.0
  name_mapping:
    xiyangyang: "喜羊羊"
    lanyangyang: "懒羊羊"
    meiyangyang: "美羊羊"
    feiyangyang: "沸羊羊"
    manyangyang: "慢羊羊"
    huitailang: "灰太狼"
    hongtailang: "红太狼"
    nuanyangyang: "暖羊羊"

clip:
  embedding_dim: 512
  batch_size: 32

retrieval:
  top_k: 10
  use_llm_rerank: true

paths:
  data_root: "data"
  output_root: "data/output"

# 模型定价 (CNY / 百万 tokens)，覆盖默认值
# 默认定价见 vl/core/cost.py DEFAULT_PRICING
pricing:
  qwen-plus:
    input_per_m: 0.8
    output_per_m: 2.0
  qwen-vl-max:
    input_per_m: 3.0
    output_per_m: 9.0
  qwen3.5-omni-plus:
    input_per_m: 2.0
    output_per_m: 6.0
  qwen3.5-omni-flash:
    input_per_m: 0.5
    output_per_m: 1.5
  qwen3-asr-flash:
    input_per_m: 0.5
    output_per_m: 1.0
