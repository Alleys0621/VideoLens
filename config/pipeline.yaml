# VideoLens 流水线配置

models:
  omni_plus: "qwen3.5-omni-plus"       # 片头/片尾曲检测
  omni_flash: "qwen3.5-omni-flash"     # ASR + 情感 + 时间戳
  vlm: "qwen-vl-max"                   # 视觉描述 + OCR
  text: "qwen-plus"                    # 文本生成

stage1:
  theme_window: 120                    # 片头/片尾检测窗口 (秒)
  chunk_duration: 60                   # Omni chunk 时长 (秒)
  silence_db: -30                      # 静音检测阈值 (dB)
  silence_remove_min: 0.3              # 删除 > 此值的静音段 (s)
  speech_remove_max: 0.3               # 删除 < 此值的孤立有声段 (s)

# 声纹库配置: 每个影视作品有独立的讯飞声纹组和角色映射
# key = 视频子目录名 (data/videos/ 下的文件夹名)
voiceprint_groups:
  喜羊羊与灰太狼:
    group_id: "xiyangyang_group"
    name_mapping:
      xiyangyang: "喜羊羊"
      huitailang: "灰太狼"
      meiyangyang: "美羊羊"
      lanyangyang: "懒羊羊"
      feiyangyang: "沸羊羊"
      manyangyang: "慢羊羊"
  家有儿女:
    group_id: "hwk_group"
    name_mapping:
      liuxing: "刘星"
      xiaxue: "夏雪"
      xiayu: "夏雨"
      xiadonghai: "夏东海"
      liumei: "刘梅"

stage2:
  content_threshold: 27.0              # 场景切换阈值
  min_scene_len: 1.0                   # 最短场景时长 (秒)
  samples_per_scene: 8                 # 每个场景提取的关键帧数

paths:
  data_root: "data"
  output_root: "data/output"

# 模型定价 (CNY / 百万 tokens)
pricing:
  qwen3.5-omni-plus:
    input: 53.0
    output: 40.0
  qwen3.5-omni-flash:
    input: 18.0
    output: 13.3
  qwen-vl-max:
    input: 3.0
    output: 9.0
  qwen-plus:
    input: 0.8
    output: 2.0
