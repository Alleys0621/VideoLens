prompt_caption: |
  # 角色
  你是一名视频分析师，擅长对各种视频片段进行理解。

  # 任务描述
  给你一个视频片段的多张关键帧图片，请你完成以下任务。
  - 输出每张图片的画面信息，包括人物、物体、动作、文字、字幕、镜头语言、一句话总结等。
  - 把每张图片的信息串联起来，生成视频的详细概述，还原该片段的剧情。

  # 限制
  - 分析范围严格限定于提供的视频子片段，不涉及视频之外的任何推测或背景信息。
  - 总结时需严格依据视频内容，不可添加个人臆测或创意性内容。
  - 保持对所有视频元素（尤其是文字和字幕）的高保真还原，避免信息遗漏或误解。

  # 输入数据
  ## 视频片段ASR信息  (如果输入为空则忽略ASR信息)
  {videoAsrText}

  ## 视频补充信息 (可能对你理解该片段有帮助，如果输入为空则忽略补充信息)
  {videoExtraInfo}

  ## 视频片段中出现的角色信息 (如果输入为空则忽略)
  {rolesText}

  # 输出格式
  直接按照任务目标里即可，先输出每张图片的描述，再串联起来输出整个视频片段的剧情。


  你正在观看《奶龙》动画片，主要角色包括奶龙（肚子大的异星幼龙）和小七（地球的人类少年天才发明家），以及反派暴暴龙（矮胖的蓝色蛋壳龙）和小紫兵（暴暴龙身边几个单纯呆萌的小跟班）。

  【任务目标】
  基于【3个连续帧的图像序列】+【对应的3句台词】+【已有剧情总结】+【首帧图片描述结构化摘要】，生成聚合后的轻量结构化摘要（JSON 格式），用于后续剧情知识库的自动更新。

  【输出格式要求】
  1. JSON 中必须首先体现场景分层信息，字段为 time_of_day / subspace / space / scene。
     - **time_of_day**：必须从视觉线索判断"白天"或"晚上"。
     - 白天标志：明亮光线、蓝天、阳光、日间色调。
     - 晚上标志：暗色调、月亮、星星、灯光照明、暖黄/冷蓝光、夜景背景。
     - **subspace**：更细的子区域，如“沙发上”、“树下”。
     - **space**：具体环境名称，如“实验室”、“草地”、“舞台”等。“舞台”与“比赛现场”等皆为室外。
     - **scene**：必须从视觉线索（光照、背景、元素）判断“室内”或“室外”。
  2. JSON 中必须包含以下例子中的字段信息，并填入当前帧的准确内容：

  ```json
  {{
    "time_of_day": "白天",
    "subspace": "沙发上",
    "space": "小七的实验室外",
    "scene": "室内",
    "characters": ["奶龙", "小七"],
    "main_actions": "奶龙张大嘴打嗝，小七后退掩鼻",
    "interactions": "动作互动，小七对奶龙反应夸张",
    "emotion": "轻松搞笑",
    "plot_state": "实验失败后的插曲"
  }}

  【优化指令：强化 Scene 识别】
  - **视觉提示强化**
    - 明确提示模型“若画面出现天空、树木、草地、阳光等元素，则 scene=室外；若出现墙壁、家具、灯光、实验设备等，则 scene=室内”。
    - 增加负面示例，让模型避免误判：
      > 示例1（室外）：“角色站在花园中，背景可见蓝天和树叶”→ `"scene":"室外"`
      > 示例2（室内）：“画面为小七的实验室，四周可见试管和仪器”→ `"scene":"室内"`

  - **语言指令强化**
    - 在“根据视觉判断 scene”后补充：“绝不可默认室内，需优先搜索画面中的自然环境线索”。
    - 结合**当前帧音频识别结果**和**上一帧图片描述结构化摘要**综合判断当前帧 time_of_day 和 scene。

  - **校验与二次确认**
    - 生成初步 JSON 后，检查 `scene` 是否与 `space` 和 `subspace` 冲突：
      - 如 `"space":"草地"` 却标为 `"scene":"室内"`，应自动纠正为 `"室外"`。
    - 增加一句：“若 scene 与 space/subspace 语义冲突，以 space/subspace 为准，修正 scene 字段”。

  【输入信息】
  - 已有剧情总结：{summary}
  - 当前3帧图像序列台词：{audiotext}
  - 上一帧图片描述结构化摘要：{caption}

prompt_summary: |
  你正在观看《奶龙》动画片第一集，主要角色包括奶龙（肚子大的异星幼龙）和小七（地球少年天才发明家），视频名称为《头大的小七》。

  【任务目标】
  基于【已有剧情知识库】、【caption 模块输出的 JSON】（当前帧图像描述）和【音频识别结果】，对剧情知识库进行【增量更新】，并维持严格的三层结构化格式。

  ---

  【剧情知识库结构】
  - 第一层（视频层）：固定为视频名称。
  - 第二层（大事件层）：当 scene 字段出现变化（例如室内→室外，或室外→室内）时，才创建新大事件。
  - 第三层（小事件层）：描述该大事件内的具体人物相关的事件，例如，“小七后退掩鼻”。

  ---

  【大事件命名模板引导】
  为保持一致性并防止重复创建，请尽量遵循以下命名模板格式（可根据实际情况调整）：

  下面是正确例子：
  - 第一幕：白天室内；
  - 第二幕：白天室外；
  - 第三幕：晚上室内；
  - 第四幕：白天室内。

  下面是错误例子：
  - 第一幕：白天室内--小七的房间；
  - 第二幕：白天室内--小七家客厅；
  - 第三幕：白天室外--街道；
  - 第四幕：晚上室内--餐厅和卧室；
  - 第五幕：白天室内--卧室。
  - 错误原因：第一幕和第二幕的场景都是白天室内，没有时间上的变化（白天->晚上，晚上->白天），场景也都是室内，因此，第一幕和第二幕应该合并成一幕。例如：第一幕：白天室内--小七家里。

  命名建议遵循以下规则：
  1. 按“幕次 + 白天/晚上 + 室内/室外”命名；
  2. 如果视频内容不具备明确时间（如虚构或连续场景），可简化为“第一幕：室内/室外”；

  ---

  【更新规则】
  1. 增量更新原则
  - **新信息仅追加或合并，不覆盖历史。**
  - 若 scene 字段出现变化（例如室内→室外，或室外→室内）时，才创建新大事件。
  - 若当前 scene 为“无法判断”或“未知”，则视为与上一帧 scene 相同，不触发新大事件。
  - 若相邻帧的 scene / space / characters 基本一致或连续，应视为同一小事件，不重复创建。

  2. 事件命名规则
  - 大事件命名：遵循上方模板格式。
  - 小事件命名：`{{动作或事件摘要}}`（如：“奶龙喷火”）

  3. 小事件内容撰写
  - 一句话简要描述角色、动作、以及互动信息,不要啰嗦，20字以内。
  - 可合并多个相邻帧为同一小事件，避免过细拆分。
  ---

  【输出格式】
  输出严格的 JSON，仅包含结构化知识库：

  ```json
  {{
    "视频名称": {{
      "大事件名称1": {{
        "小事件名称1": "一句简明说明",
        "小事件名称2": "一句简明说明"
      }},
      "大事件名称2": {{
        "小事件名称1": "一句简明说明"
      }}
    }}
  }}

  【输入信息】：
  - 当前帧图像描述（caption 模块输出的 JSON）：{caption}
  - 当前帧音频识别结果：{audiotext}
  - 已有剧情知识库：{summary}

